##
# TECHNOLOGY DEFINITIONS
##

templates:
    interest_rate_setter:
        cost_interest_rate:
          data: 0.073  # average wind onshore WACC OECD from [@Steffen:2019]
          index: monetary
          dims: costs

techs:
  ##
  # Firm supply
  ##

  load_shedding:
    name: "Shed load due to insufficient generation"
    color: "#A349A4"
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    lifetime: 50
    cost_flow_out:
      data: 0.25 #0.25 # kEUR per MWh - about 10x more expensive than the most expensive generator
      index: monetary
      dims: costs

  ccgt:
    name: "CCGT backup plant"
    color: "#73197A"
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    lifetime: 30
    cost_flow_out:
      data: 0.09 # kEUR per MWh (all-in variable generation cost proxy: fuel + CO2 + VOM)
      index: monetary
      dims: costs

  # ##
  # # Variable renewable supply
  # ##



  wind_offshore:
    name: "Wind power offshore"
    color: "#56CBF9"
    base_tech: supply
    template: interest_rate_setter
    carrier_out: power
    source_unit: per_cap
    lifetime: 30 
    cost_flow_cap:
      data: 0 #1769.1171 # kEUR per MW
      index: monetary
      dims: costs

  battery_storage:
      name: "Lithium-ion battery storage"
      color: "#FF6B6B"
      base_tech: storage
      template: interest_rate_setter
      carrier_in: power
      carrier_out: power
      cyclic_storage: false  # operate-mode requires non-cyclic storage
      storage_initial: 0 # start empty at first timestep to avoid NaN in storage balance
      storage_cap_per_unit: 5 # MWh per MW of capacity (4-hour battery)
      flow_out_eff: 0.95 # Round-trip efficiency (discharge)
      flow_in_eff: 0.947 # (charge)
      lifetime: 20 # Battery lifetime in years
      cost_flow_cap:
        data: 160  # kEUR per MW (power capacity)
        index: monetary
        dims: costs
      cost_storage_cap:
        data: 100   # kEUR per MWh (energy capacity)
        index: monetary
        dims: costs
      cost_flow_in:
        data: 0.000001 # kEUR per MWh (negligible variable cost)
        index: monetary
        dims: costs
      cost_flow_out:
        data: 0.000001 # kEUR per MWh (negligible variable cost)
        index: monetary
        dims: costs

  ##
  # Hydrogen chain
  ##

  electrolyser:
    name: "Electrolyser"
    color: "#449C2A"
    base_tech: conversion
    template: interest_rate_setter
    carrier_in: power
    carrier_out: hydrogen
    flow_out_eff: 0.76
    lifetime: 20
    cost_flow_cap:
      data: 280 # kEUR per MW (this is cost for onshore)
      index: monetary
      dims: costs
    cost_flow_in:
      data: 0.000001 # kEUR per MWh
      index: monetary
      dims: costs


  ##
  # Demand
  ##

  demand_power:
    name: "Power demand"
    color: "#072486"
    base_tech: demand
    carrier_in: power

  demand_big_user:
    name: "Flexible large electricity user"
    color: "#F4A261"
    base_tech: demand
    carrier_in: power
    sink_use_max: 0 # disabled by default; activated in scenario overrides

  demand_h2_offtake:
    name: "Hydrogen offtake demand"
    color: "#2A9D8F"
    base_tech: demand
    carrier_in: hydrogen
    sink_use_max: 0 # disabled by default; activated in hydrogen scenario

  curtailment:
    name: "Power curtailment"
    color: "#000000"
    base_tech: demand
    carrier_in: power
    sink_use_max: 2000000 # higher than peak demand
    cost_flow_in:
      data: 0.001 # kEUR per MWh penalty on spilled power
      index: monetary
      dims: costs

