##
# Scenarios are optional, named combinations of overrides
##
scenarios:
  # more_renewables: ["higher_wind","higher_solar"]
  # generation_outage: ["lower_ccgt"]
  baseline: ["neutral_baseline"]
  surplus_to_battery: ["enable_battery_pathway"]
  surplus_to_hydrogen: ["enable_hydrogen_pathway"]
  surplus_to_big_user: ["enable_big_user_pathway"]
  surplus_to_big_user_two_nodes: ["enable_big_user_two_nodes_pathway"]
  ua_baseline_avg: ["neutral_baseline", "wind_cf_avg_real"]
  ua_baseline_rndm: ["neutral_baseline", "wind_cf_rndm"]
  ua_battery_avg: ["enable_battery_pathway", "wind_cf_avg_real"]
  ua_battery_rndm: ["enable_battery_pathway", "wind_cf_rndm"]
  ua_hydrogen_avg: ["enable_hydrogen_pathway", "wind_cf_avg_real"]
  ua_hydrogen_rndm: ["enable_hydrogen_pathway", "wind_cf_rndm"]
  ua_big_user_2n_avg: ["enable_big_user_two_nodes_pathway", "wind_cf_avg_real"]
  ua_big_user_2n_rndm: ["enable_big_user_two_nodes_pathway", "wind_cf_rndm"]
  uw_baseline_normal: ["neutral_baseline", "wind_cf_avg_real"]
  uw_baseline_wake8: ["neutral_baseline", "wind_cf_avg_real_wake8"]
  uw_battery_normal: ["enable_battery_pathway", "wind_cf_avg_real"]
  uw_battery_wake8: ["enable_battery_pathway", "wind_cf_avg_real_wake8"]
  uw_hydrogen_normal: ["enable_hydrogen_pathway", "wind_cf_avg_real"]
  uw_hydrogen_wake8: ["enable_hydrogen_pathway", "wind_cf_avg_real_wake8"]
  uw_big_user_2n_normal: ["enable_big_user_two_nodes_pathway", "wind_cf_avg_real"]
  uw_big_user_2n_wake8: ["enable_big_user_two_nodes_pathway", "wind_cf_avg_real_wake8"]

##
# Overrides are the building blocks from which scenarios can be defined
##
overrides:

  neutral_baseline:
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
            storage_cap: 0
          electrolyser:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 0

  enable_battery_pathway:
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 30000 #1200 # MW
            storage_cap: 120000 # MWh (about 4.1h at rated power)
          electrolyser:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 0

  enable_hydrogen_pathway:
    techs:
      demand_h2_offtake:
        cost_flow_in:
          data: -0.03 #-0.002 # kEUR per MWh_h2 value proxy for delivered hydrogen
          index: monetary
          dims: costs
      nld_to_h2_offtake_line:
        base_tech: transmission
        color: "#2A9D8F"
        carrier_in: hydrogen
        carrier_out: hydrogen
        link_from: NLD
        link_to: H2_OFFTAKE
        one_way: true
        flow_out_eff: 0.995
        flow_cap: 18000 # MW_h2 transfer capacity
        cost_flow_cap:
          data: 0.001 # small annualized transport cost proxy (kEUR/MW)
          index: monetary
          dims: costs
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
          electrolyser:
            flow_cap: 18000 # MW
          demand_big_user:
            sink_use_max: 0
      H2_OFFTAKE:
        latitude: 52.2
        longitude: 5.3
        techs:
          demand_h2_offtake:
            sink_use_max: 18000 # MW_h2 offtake ceiling

  enable_big_user_pathway:
    techs:
      demand_big_user:
        cost_flow_in:
          data: -0.01 # kEUR per MWh revenue-equivalent for delivered power
          index: monetary
          dims: costs
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
          electrolyser:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 2500 # MW flexible demand ceiling

  enable_big_user_two_nodes_pathway:
    techs:
      demand_big_user:
        cost_flow_in:
          data: -0.05 # kEUR per MWh revenue-equivalent for delivered power
          index: monetary
          dims: costs
      nld_to_big_user_line:
        base_tech: transmission
        color: "#0023F5"
        carrier_in: power
        carrier_out: power
        link_from: NLD
        link_to: BIG_USER
        one_way: true
        flow_out_eff: 0.98
        flow_cap: 6000 # MW transfer capacity
        cost_flow_cap:
          data: 0.001 # small annualized grid-use cost proxy (kEUR/MW)
          index: monetary
          dims: costs
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
          electrolyser:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 0
      BIG_USER:
        latitude: 52.0
        longitude: 5.5
        techs:
          demand_big_user:
            sink_use_max: 4000 # MW Demand for electrolysis 
